# Rights-cleared imagery for specific 30A events, matched on a substring of the
# event title as it appears in events.html. An event post uses the first match
# here, then falls back to `media.local`, then to the cottage pool.
#
# ONLY list an image this business may use commercially:
#   - photographed by you — but note SEASIDE bars commercial photography in its
#     commercial district without a permit (seasidefl.com/photography-requests)
#   - supplied by the event organiser for partner promotion (ask — most say yes)
#   - licensed stock, or a guest photo with written permission
# Never a photo lifted from someone's Instagram or Facebook: that is their
# copyright, and reposting it to market paid stays is infringement.
#
# `credit` is optional and is appended to the caption when the source requires it.
event_media: {}
#   - match: Seafood Festival
#     file: photos/local/destin-seafood.jpg
#     shows: boats and stalls along the harbor boardwalk
#     alt: Crowds along the Destin harbor boardwalk at a seafood festival, boats moored alongside.
#     credit: Destin Seafood Festival

max_auto_posts_per_day: 2   # per platform; evergreen human-photo prompts don't count

# What guests on 30A actually worry about, and what they come here to celebrate.
# From market research, Sept 2026. Each worry is paired with the TRUE thing about
# this property that answers it — the copywriter may use the answer, and must
# never make the generic claim without it. Roughly one post in three should
# answer a worry rather than just describe a stay.
audience:
  pain_points:
    - worry: >
        Beach access on 30A. Much of the dry sand is privately owned, and guests
        report being funneled into a crowded public strip, or blocked by cones,
        with empty beach either side. It is the single biggest 30A-specific
        anxiety, and 2025's SB1622 made access a live topic again.
      answer: >
        The nearest access is Pelayo, a PUBLIC Walton County beach access, a
        3-minute walk straight across Scenic 30A — no resort gate, no shuttle,
        no private-beach question. Say "public beach access" explicitly.
    - worry: >
        Fee shock. Guests abandon bookings when cleaning and service fees stack
        up at checkout, and resent fees they did not see coming.
      answer: >
        Booking is direct at book.sunandmoon30a.com — live availability, real
        prices and instant confirmation, with no third-party booking fee.
    - worry: >
        Cleanliness is the number-one cause of a disappointing stay — 45% of
        travellers who were let down blame it.
      answer: >
        The cottages hold a 5.0 average rating with 98% of guests recommending
        them. Let the rating speak; never claim spotlessness directly.
    - worry: >
        Big groups get split across two houses streets apart, or crammed into
        one that does not fit.
      answer: >
        Golden Sun and Blue Moon sit side by side on the same lane — six
        bedrooms, four baths, sixteen guests, one address.
    - worry: >
        Crowds and parking around Seaside in season.
      answer: >
        Seagrove is the quiet pocket of Scenic 30A: a residential lane, a
        community pool steps away, and Seaside reachable without moving the car.
  celebrations:
    - Multi-generational reunions — grandparents, parents and kids under one roof.
    - Milestone birthdays, anniversaries and small weddings.
    - The trip that becomes an annual tradition; returning guests booking the same week.
    - Sunset as the evening ritual — the deck, the walk over, the last swim.
    - A child's first time seeing the Gulf.

# Content pillars: the engine cycles through these methodically so the feed
# builds a brand instead of repeating one note. Weights set the mix.
pillars:
  - key: availability_spotlight
    weight: 4
    goal: bookings
    description: >
      Promote specific open dates from the live booking calendar — highest-scored
      windows first (weekends, holidays, gap nights). Paired with a local event
      whenever one lands on those dates.
  - key: local_events
    weight: 3
    goal: bookings + brand
    description: >
      Festivals and happenings along 30A (from events.html) — announce,
      countdown, and point at the cottage that's open that weekend.
  - key: local_guide
    weight: 1
    goal: brand + SEO
    description: Area highlights — trails, restaurants, seasonal happenings near the property.
  - key: behind_the_scenes
    weight: 1
    goal: brand
    description: Host story, prep rituals, design details of each cottage.
  - key: guest_love
    weight: 1
    goal: trust
    description: Reviews, UGC reposts (with permission), guest stories.

# Intentional fee/rate promotion. Leave a rate null to omit pricing from copy.
rates:
  currency: USD
  sun: null        # e.g. 189 — nightly rate to feature in availability posts
  moon: null
  full: null
  promo_note: null # e.g. "Midweek stays 15% off in June"
