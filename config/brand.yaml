      alt: The white front facade of Blue Moon cottage, with columns and a palm beside the walk.
    - file: photos/blue-moon/010.jpg
      shows: the open living room
      alt: Blue Moon's open living room, pale sofas and armchairs in a bright coastal space.
    - file: photos/blue-moon/020.jpg
      shows: the kitchen
      alt: Blue Moon's kitchen with white cabinets and a stainless range and refrigerator.
    - file: photos/blue-moon/040.jpg
      shows: an aerial over Seagrove to the Gulf
      alt: Aerial view over Seagrove rooftops to the Gulf, the cottages among the streets below.
    - file: photos/blue-moon/060.jpg
      shows: the kitchen looking through to a bedroom
      alt: Blue Moon's kitchen looking through to a bedroom, pendant lights over the counter.
    - file: photos/blue-moon/080.jpg
      shows: an aerial of both cottages
      alt: Aerial view of the two cottages and their metal roofs among the Seagrove streets.
  full:
    - file: images/both-cottages.jpg
      shows: both cottages from the street
      alt: Golden Sun and Blue Moon side by side on Crystal Court, seen from the street under palms.
    - file: images/sunset-seagrove.jpg
      shows: the beach at sunset
      alt: An adult and child silhouetted on the beach at sunset, the sun low over the Gulf.
  events:
    - file: images/sunset-seagrove.jpg
      shows: the beach at sunset
      alt: An adult and child silhouetted on the beach at sunset, the sun low over the Gulf.
    - file: images/both-cottages.jpg
      shows: both cottages from the street
      alt: Golden Sun and Blue Moon side by side on Crystal Court, seen from the street under palms.
    - file: photos/golden-sun/001.jpg
      shows: the cottage exterior at dusk
      alt: Golden Sun cottage at dusk, warm light in the windows, tall palms in the foreground.
    - file: photos/blue-moon/010.jpg
      shows: the open living room
      alt: Blue Moon's open living room, pale sofas and armchairs in a bright coastal space.

hashtags:
  always: ["#SunAndMoon30A", "#StayWithTheSky"]
  rotating:
    - "#30A"
    - "#30Aliving"
    - "#Seaside30A"
    - "#Seagrove"
    - "#EmeraldCoast"
    - "#FloridaPanhandle"
    - "#WeekendGetaway"
    - "#VacationRental"
    - "#BeachHouse"
    - "#GulfCoast"

max_auto_posts_per_day: 2   # per platform; evergreen human-photo prompts don't count

# Content pillars: the engine cycles through these methodically so the feed
# builds a brand instead of repeating one note. Weights set the mix.
pillars:
  - key: availability_spotlight
    weight: 4
    goal: bookings
    description: >
      Promote specific open dates from the live booking calendar — highest-scored
      windows first (weekends, holidays, gap nights). Paired with a local event
      whenever one lands on those dates.
  - key: local_events
    weight: 3
    goal: bookings + brand
    description: >
      Festivals and happenings along 30A (from events.html) — announce,
      countdown, and point at the cottage that's open that weekend.
  - key: local_guide
    weight: 1
    goal: brand + SEO
    description: Area highlights — trails, restaurants, seasonal happenings near the property.
  - key: behind_the_scenes
    weight: 1
    goal: brand
    description: Host story, prep rituals, design details of each cottage.
  - key: guest_love
    weight: 1
    goal: trust
    description: Reviews, UGC reposts (with permission), guest stories.

# Intentional fee/rate promotion. Leave a rate null to omit pricing from copy.
rates:
  currency: USD
  sun: null        # e.g. 189 — nightly rate to feature in availability posts
  moon: null
  full: null
  promo_note: null # e.g. "Midweek stays 15% off in June"
