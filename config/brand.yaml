# Sun & Moon 30A — brand system for generated content.

brand:
  name: Sun & Moon 30A
  website: https://sunandmoon30a.com
  booking_url: https://book.sunandmoon30a.com
  tagline: "Where every stay turns with the sky."
  voice:
    - warm, unhurried, a little celestial — sunrise-to-starlight imagery
    - concrete and sensory (what guests see, taste, hear), never salesy filler
    - always ends with one clear call to action (book, save the date, link in bio)
  units:
    - key: sun
      label: Golden Sun
      angle: bright mornings, coffee on the back patio, sunset light
    - key: moon
      label: Blue Moon
      angle: stargazing, slow evenings by the fireplace, deep quiet
    - key: full
      label: The whole property
      angle: both cottages together — six bedrooms, one address, room for sixteen

# Verified facts the copywriter may use. Keep this honest: anything not here
# (or in the daily brief) is off-limits for generated copy.
facts:
  - Two cottages, one address, on Crystal Court in Seagrove Beach — a quiet residential lane just off Scenic 30A.
  - Golden Sun (53 Crystal Court) — 3 bedrooms, 2 baths, sleeps 8; two king bedrooms plus a queen, fireplace, covered back patio with gas grill.
  - Blue Moon (65 Crystal Court) — 3 bedrooms, 2 baths, sleeps 8; three king bedrooms (one with an en-suite jetted tub), fireplace, private back patio with gas grill.
  - Booked together, the full property is 6 bedrooms, 4 baths, and sleeps 16 — built for reunions, milestone trips, and weddings.
  - Closest beach access (Pelayo) is a 3-minute walk, just across Scenic 30A.
  - A quiet community pool is steps from both cottages.
  - Seaside is 1.8 miles / 5 minutes by car; WaterColor 2.4 miles / 9 minutes.
  - Each cottage has a cozy living-room FIREPLACE (indoor). There is no outdoor firepit.
  - Each cottage has a private/covered back patio with comfortable seating and a gas grill.
  - Fully equipped kitchens, smart TVs in every bedroom, high-speed WiFi throughout.
  - Beach chairs, umbrella and a beach wagon are provided.
  - Book direct at book.sunandmoon30a.com — live availability, real prices, instant confirmation.

# Public photos on the website. Each entry carries hand-written alt text that
# matches the actual image — the copywriter never sees the photo, so it must
# not invent a description. `shows` tells the copywriter what is in frame so
# the caption and the image agree.
# Instagram requires a public JPEG, <= 8 MB, aspect ratio between 4:5 and
# 1.91:1 — images/aerial-30a.jpg is 1.92:1 and is therefore not listed.
