# Sun & Moon 30A — brand system for generated content.

brand:
  name: Sun & Moon 30A
  website: https://sunandmoon30a.com
  booking_url: https://sunandmoon30a.com/book
  tagline: "Where every stay turns with the sky."
  voice:
    - warm, unhurried, a little celestial — sunrise-to-starlight imagery
    - concrete and sensory (what guests see, taste, hear), never salesy filler
    - always ends with one clear call to action (book, save the date, link in bio)
  units:
    - key: sun
      label: Golden Sun
      angle: bright mornings, golden-hour decks, coffee at sunrise
    - key: moon
      label: Blue Moon
      angle: stargazing, firepit nights, slow evenings, deep quiet

hashtags:
  always: ["#SunAndMoon30A", "#StayWithTheSky"]
  rotating:
    - "#30A"
    - "#30Aliving"
    - "#ShortTermRental"
    - "#WeekendGetaway"
    - "#StaycationGoals"
    - "#TravelMore"
    - "#VacationRental"
    - "#GetawayWeekend"
    - "#FloridaPanhandle"
    - "#EmeraldCoast"

# Content pillars: the engine cycles through these methodically so the feed
# builds a brand instead of repeating one note. Weights set the mix.
pillars:
  - key: availability_spotlight
    weight: 3
    goal: bookings
    description: >
      Promote specific open dates found on the calendar — highest-scored windows
      first (weekends, holidays, gap nights). Mention the rate/fee intentionally
      when configured, with urgency framed warmly ("the deck is free this
      Saturday — someone should be on it").
  - key: events_experiences
    weight: 3
    goal: bookings + brand
    description: >
      Big events and on-site experiences at Sun & Moon 30A — pulled from the
      events calendar. Announce, countdown, recap.
  - key: local_guide
    weight: 2
    goal: brand + SEO
    description: Area highlights — trails, restaurants, seasonal happenings near the property.
  - key: behind_the_scenes
    weight: 1
    goal: brand
    description: Host story, prep rituals, design details of each suite.
  - key: guest_love
    weight: 1
    goal: trust
    description: Reviews, UGC reposts (with permission), guest stories.

# Intentional fee/rate promotion. Leave a rate null to omit pricing from copy.
rates:
  currency: USD
  sun: null        # e.g. 189 — nightly rate to feature in availability posts
  moon: null
  whole_property: null
  promo_note: null # e.g. "Midweek stays 15% off in June"
