# Availability + events sources for Sun & Moon 30A.
#
# Each unit can have any mix of sources; busy blocks from all of them are
# merged, so cross-listing (site + Airbnb + VRBO) stays consistent.
# Booked nights appear as BUSY events; everything else is open.
#
# >>> ACTION NEEDED: no calendar source is wired up yet, so the engine treats
# >>> both units as "availability unknown" and promotes nothing. sunandmoon30a.com
# >>> does resolve now (checked 2026-08-23); paste the booking engine's iCal
# >>> export URL and the matching Airbnb/VRBO export below to turn sync on.

# Nights are counted in the property's local timezone. Feeds disagree about how
# they express a stay — OTAs export all-day dates, booking engines often export
# UTC datetimes — and reading a UTC timestamp as a calendar date shifts a night
# by one whenever check-in/check-out crosses midnight UTC. Everything is
# normalised to this zone before it becomes a night.
property:
  timezone: America/Chicago   # 30A / Walton County, FL

units:
  sun:
    label: Golden Sun
    sources:
      - type: ical
        url: ""            # e.g. https://sunandmoon30a.com/calendar/sun.ics
      - type: ical
        url: ""            # e.g. Airbnb iCal export for the Golden Sun listing
      - type: google_calendar
        calendar_id: ""    # optional, if availability is kept in Google Calendar
  moon:
    label: Blue Moon
    sources:
      - type: ical
        url: ""            # e.g. https://sunandmoon30a.com/calendar/moon.ics
      - type: ical
        url: ""            # e.g. Airbnb iCal export for the Blue Moon listing
      - type: google_calendar
        calendar_id: ""

# Big events & experiences hosted at the property (announcements, countdowns,
# recaps are generated from this calendar).
events:
  sources:
    - type: ical
      url: ""              # e.g. https://sunandmoon30a.com/events.ics
    - type: google_calendar
      calendar_id: ""

scoring:
  horizon_days: 60         # how far ahead to look for open windows
  weekend_bonus: 3         # Fri/Sat nights are the money nights
  holiday_bonus: 5
  near_term_bonus: 2       # open nights within 14 days get urgency
  gap_night_bonus: 2       # 1-2 night gaps between bookings — fill them
  min_window_nights: 1
