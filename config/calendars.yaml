# Availability + events sources for Sun & Moon 38.
#
# Each unit can have any mix of sources; busy blocks from all of them are
# merged, so cross-listing (site + Airbnb + VRBO) stays consistent.
# Booked nights appear as BUSY events; everything else is open.
#
# >>> ACTION NEEDED: sunandmoon38.com has no public DNS yet (2026-06-10).
# >>> When the site/booking engine is live, paste its iCal export URLs below.

units:
  sun:
    label: The Sun Suite
    sources:
      - type: ical
        url: ""            # e.g. https://sunandmoon38.com/calendar/sun.ics
      - type: ical
        url: ""            # e.g. Airbnb iCal export for the Sun listing
      - type: google_calendar
        calendar_id: ""    # optional, if availability is kept in Google Calendar
  moon:
    label: The Moon Suite
    sources:
      - type: ical
        url: ""            # e.g. https://sunandmoon38.com/calendar/moon.ics
      - type: ical
        url: ""
      - type: google_calendar
        calendar_id: ""

# Big events & experiences hosted at the property (announcements, countdowns,
# recaps are generated from this calendar).
events:
  sources:
    - type: ical
      url: ""              # e.g. https://sunandmoon38.com/events.ics
    - type: google_calendar
      calendar_id: ""

scoring:
  horizon_days: 60         # how far ahead to look for open windows
  weekend_bonus: 3         # Fri/Sat nights are the money nights
  holiday_bonus: 5
  near_term_bonus: 2       # open nights within 14 days get urgency
  gap_night_bonus: 2       # 1-2 night gaps between bookings — fill them
  min_window_nights: 1
