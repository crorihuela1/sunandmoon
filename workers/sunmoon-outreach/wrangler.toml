# sunmoon-outreach — referral outreach sender.
# Replaces outreach_email.py, lost when the local Mac died on 2026-08-12.
# See docs/RECOVERY.md.
name = "sunmoon-outreach"
main = "src/index.js"
compatibility_date = "2026-09-01"

[triggers]
# 13:00 UTC = 9am America/New_York (EDT), weekdays only.
# The old sender never sent on weekends; this matches that.
crons = ["0 13 * * 1-5"]

[vars]
DAILY_CAP = "25"
DRY_RUN = "true"             # flip to "false" only when you are ready to send
TRACK_BASE = "https://track.sunandmoon30a.com"
BOOK_BASE = "https://book.sunandmoon30a.com"
FROM_EMAIL = "cristian@sunandmoon30a.com"
REPLY_TO = "experience@sunandmoon30a.com"
PROJECT_ID = ""              # Supabase project uuid used to tag rows
HERO_IMAGE_URL = ""          # optional; omitted from the email when blank

# Secrets — set with `wrangler secret put <NAME>`, never commit:
#   SUPABASE_URL, SUPABASE_SERVICE_KEY, RESEND_API_KEY, ADMIN_TOKEN
